<script>
// 초기 데이터 (기본적으로 prepayPct는 0으로 시작)
const rawData = [
  { name: '수입', items: 4, unit: 8548340 },
  { name: '티엘씨', items: 54, unit: 1328600 },
  { name: '베이직옵틱스', items: 5, unit: 826334 },
  { name: '중원테크', items: 2, unit: 382000 },
  { name: '스카이즈', items: 1, unit: 324000 },
  { name: '명신기계', items: 44, unit: 187042 },
  { name: '씨앤디서플라이', items: 1, unit: 160000 },
  { name: '기구가공팀', items: 5, unit: 113600 },
  { name: '독도', items: 5, unit: 81333 },
  { name: '남해전자', items: 11, unit: 77030 },
  { name: '미확인/기타', items: 27, unit: 59356 },
  { name: '아태일렉트로닉스', items: 5, unit: 41630 },
  { name: '서일테크', items: 21, unit: 33229 },
  { name: '신광', items: 1, unit: 27000 },
  { name: '케이블트론', items: 2, unit: 21300 },
  { name: '중앙정밀', items: 13, unit: 20116 },
  { name: '탑전자', items: 7, unit: 17919 },
  { name: '옥신씨엔씨', items: 2, unit: 16500 },
  { name: '명성화학', items: 17, unit: 13570 },
  { name: '옵토웰', items: 1, unit: 10000 },
  { name: '구매', items: 14, unit: 9785 },
  { name: '씨앤와이', items: 1, unit: 4500 },
  { name: '신광산업', items: 6, unit: 4178 },
  { name: '동우포장', items: 1, unit: 2580 },
  { name: '세인정밀', items: 50, unit: 2500 },
  { name: '피앤피컴포넌츠', items: 1, unit: 1700 },
  { name: '한국아이현', items: 4, unit: 1600 },
  { name: '호재상사', items: 1, unit: 1400 },
  { name: '대현', items: 2, unit: 1000 },
  { name: '대연정밀금속', items: 1, unit: 1000 },
  { name: '에이원고무', items: 3, unit: 158 },
];

let tableData = [];
let currentQty = 1;
let saveTimer = null;

// 유틸리티 포맷팅
const fmtMoney = (n) => '₩' + Math.round(n).toLocaleString('ko-KR');
const fmtNum = (n) => Math.round(n).toLocaleString('ko-KR');
const parseNum = (str) => parseFloat(String(str).replace(/[^0-9.-]/g, '')) || 0;

function saveToFirebase() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    db.collection('costingTool').doc('spreadsheet_state').set({
      tableData: tableData,
      currentQty: currentQty,
      updatedAt: new Date().toISOString()
    }).then(() => {
      const ind = document.getElementById('saveIndicator');
      ind.classList.remove('opacity-0');
      setTimeout(() => ind.classList.add('opacity-0'), 2000);
    }).catch(console.error);
  }, 1000);
}

function init() {
  db.collection('costingTool').doc('spreadsheet_state').get().then(doc => {
    if (doc.exists && doc.data().tableData && doc.data().tableData.length > 0) {
      tableData = doc.data().tableData;
      currentQty = doc.data().currentQty || 1;
      document.getElementById('qtyInput').value = currentQty;
    } else {
      tableData = rawData.map((d, i) => ({ ...d, id: Date.now() + i, active: true, prepayPct: 0 }));
      currentQty = 1;
    }
    document.getElementById('loadingScreen').style.display = 'none';
    tableData.sort((a, b) => b.unit - a.unit);
    renderTable();
    setupEventListeners();
    updateTotals();
    updatePresetButtons();
  }).catch(err => {
    console.error(err);
    document.getElementById('loadingScreen').style.display = 'none';
    tableData = rawData.map((d, i) => ({ ...d, id: Date.now() + i, active: true, prepayPct: 0 }));
    tableData.sort((a, b) => b.unit - a.unit);
    renderTable();
    setupEventListeners();
    updateTotals();
    updatePresetButtons();
  });
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  
  tableData.forEach((row, index) => {
    const tr = document.createElement('tr');
    tr.className = `border-b border-gray-200 transition-colors hover:bg-blue-50/30 ${row.active ? '' : 'table-row-inactive'}`;
    tr.dataset.id = row.id;
    
    tr.innerHTML = `
      <td class="p-1 text-center border-r border-gray-100">
        <input type="checkbox" data-index="${index}" class="toggle-active w-3.5 h-3.5 cursor-pointer accent-blue-600" ${row.active ? 'checked' : ''}>
      </td>
      <td class="p-1 text-center border-r border-gray-100 text-gray-400 idx-cell">${index + 1}</td>
      <td class="p-0 border-r border-gray-100">
        <input type="text" data-index="${index}" class="cell-input name-input font-medium text-gray-800" value="${row.name}">
      </td>
      <td class="p-0 border-r border-gray-100">
        <input type="text" data-index="${index}" class="cell-input num-input items-input text-right text-gray-600" value="${fmtNum(row.items)}">
      </td>
      <td class="p-0 border-r border-gray-100 bg-blue-50/10">
        <input type="text" data-index="${index}" class="cell-input num-input unit-input text-right text-blue-800 font-bold" value="${fmtNum(row.unit)}">
      </td>
      <td class="p-1 text-right border-r border-gray-100 px-2 calc-total font-bold text-gray-900 bg-blue-50/30">
        ${fmtMoney(row.unit * currentQty)}
      </td>
      <td class="p-0 border-r border-gray-100">
        <input type="text" data-index="${index}" class="cell-input num-input prepay-input text-center text-purple-700 font-bold bg-purple-50/10" value="${row.prepayPct}">
      </td>
      <td class="p-1 text-right border-r border-gray-100 px-2 calc-prepay font-bold text-purple-900 bg-purple-50/30">
        ₩0
      </td>
      <td class="p-1 border-r border-gray-100 pl-2">
        <div class="flex items-center gap-1.5 w-full">
          <div class="w-14 h-1.5 bg-gray-200 rounded-sm overflow-hidden flex-shrink-0">
            <div class="bar-fill h-full transition-all duration-500 ease-out" style="width:0%"></div>
          </div>
          <span class="text-[10px] text-gray-500 w-10 text-right pct-text tabular-nums">0.0%</span>
        </div>
      </td>
      <td class="p-1 text-center">
        <button class="delete-btn text-gray-300 hover:text-red-500 transition-colors w-6 h-6 rounded hover:bg-red-50 flex items-center justify-center" data-index="${index}" title="항목 삭제">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// 단가 기준 내림차순 정렬 후 DOM 요소 위치만 변경 (포커스 유지용)
function applySortToDOM() {
  tableData.sort((a, b) => b.unit - a.unit);
  
  const tbody = document.getElementById('tableBody');
  const rows = Array.from(tbody.querySelectorAll('tr'));
  
  // 데이터 정렬 순서대로 DOM 요소(행) 재배치
  tableData.forEach((data, index) => {
    const row = rows.find(r => r.dataset.id == data.id);
    if(row) {
      tbody.appendChild(row); // 이미 존재하는 DOM을 뒤로 옮김 (자동 재정렬 효과)
      
      // 순번 셀 업데이트
      row.querySelector('.idx-cell').textContent = index + 1;
      
      // 내부 입력창 및 버튼의 data-index 갱신 (이후 이벤트 처리를 위해 필수)
      row.querySelectorAll('[data-index]').forEach(el => el.setAttribute('data-index', index));
    }
  });
  
  // 정렬 후 순위별 바 색상이 달라질 수 있으므로 토탈 업데이트 재호출
  updateTotals();
}

function updateTotals() {
  const activeData = tableData.filter(d => d.active);
  const activeUnitTotal = activeData.reduce((sum, d) => sum + d.unit, 0);
  const activeItemsTotal = activeData.reduce((sum, d) => sum + d.items, 0);
  const activePrepayTotal = activeData.reduce((sum, d) => sum + (d.unit * currentQty * (d.prepayPct / 100)), 0);
  
  const grandTotal = activeUnitTotal * currentQty;
  
  // 1,2,3위 순위 구하기 (색상 표시용)
  const sortedActive = [...activeData].sort((a, b) => b.unit - a.unit);
  const topIds = sortedActive.slice(0, 3).map(d => d.id);
  const maxUnit = sortedActive.length > 0 ? sortedActive[0].unit : 1; 

  // 1. 요약(Metrics) 업데이트
  document.getElementById('m-total-cost').textContent = fmtMoney(grandTotal);
  document.getElementById('m-prepay-cost').textContent = fmtMoney(activePrepayTotal);
  document.getElementById('m-unit-cost').textContent = fmtMoney(activeUnitTotal);
  document.getElementById('m-total-items').textContent = fmtNum(activeItemsTotal * currentQty);
  document.getElementById('m-active-vendors').textContent = activeData.length;
  document.getElementById('m-total-vendors').textContent = tableData.length;
  
  document.querySelectorAll('.m-sub-qty').forEach(el => el.textContent = `수량 ${fmtNum(currentQty)}개 기준`);

  // 2. 푸터(Footer) 업데이트
  document.getElementById('f-items').textContent = fmtNum(activeItemsTotal * currentQty);
  document.getElementById('f-unit').textContent = fmtMoney(activeUnitTotal);
  document.getElementById('f-total').textContent = fmtMoney(grandTotal);
  document.getElementById('f-prepay').textContent = fmtMoney(activePrepayTotal);

  // 3. 테이블 행별 데이터(수량별 금액, 선지급액, 막대) 동적 갱신
  const tbody = document.getElementById('tableBody');
  const rows = tbody.querySelectorAll('tr');
  
  tableData.forEach((row, i) => {
    if(!rows[i]) return;
    
    // 금액 계산
    const rowTotal = row.unit * currentQty;
    const rowPrepay = rowTotal * (row.prepayPct / 100);
    
    rows[i].querySelector('.calc-total').textContent = row.active ? fmtMoney(rowTotal) : '-';
    rows[i].querySelector('.calc-prepay').textContent = row.active ? fmtMoney(rowPrepay) : '-';
    
    // 비율 및 바 너비
    const pctVal = (activeUnitTotal > 0 && row.active) ? (row.unit / activeUnitTotal * 100) : 0;
    const barWidth = (maxUnit > 0 && row.active) ? (row.unit / maxUnit * 100) : 0;
    
    rows[i].querySelector('.pct-text').textContent = row.active ? pctVal.toFixed(1) + '%' : '0.0%';
    
    const barFill = rows[i].querySelector('.bar-fill');
    barFill.style.width = `${Math.min(barWidth, 100)}%`;
    
    // 순위에 따른 바 색상 배정
    let barColorClass = 'bg-blue-300';
    if (!row.active) barColorClass = 'bg-gray-300';
    else if (topIds[0] === row.id) barColorClass = 'bg-[#3266ad]'; // 1위
    else if (topIds[1] === row.id) barColorClass = 'bg-[#5A88C5]'; // 2위
    else if (topIds[2] === row.id) barColorClass = 'bg-[#82AADB]'; // 3위
    
    barFill.className = `bar-fill h-full transition-all duration-500 ease-out ${barColorClass}`;
  });

  // 헤더 체크박스 상태 갱신
  const checkAllBox = document.getElementById('checkAll');
  if(tableData.length === 0) checkAllBox.checked = false;
  else checkAllBox.checked = activeData.length === tableData.length;
}

// === 이벤트 리스너 설정 ===
function setupEventListeners() {
  const tbody = document.getElementById('tableBody');

  // 체크박스 토글
  tbody.addEventListener('change', (e) => {
    if (e.target.classList.contains('toggle-active')) {
      const idx = e.target.getAttribute('data-index');
      tableData[idx].active = e.target.checked;
      
      const tr = e.target.closest('tr');
      if (tableData[idx].active) tr.classList.remove('table-row-inactive');
      else tr.classList.add('table-row-inactive');
      
      updateTotals();
      saveToFirebase();
    }
  });

  // 인라인 수정 (실시간 값 반영)
  tbody.addEventListener('input', (e) => {
    const idx = e.target.getAttribute('data-index');
    if (!tableData[idx]) return;

    if (e.target.classList.contains('name-input')) {
      tableData[idx].name = e.target.value;
      saveToFirebase();
    } else if (e.target.classList.contains('num-input')) {
      let val = parseNum(e.target.value);
      
      if (e.target.classList.contains('items-input')) tableData[idx].items = val;
      if (e.target.classList.contains('unit-input')) tableData[idx].unit = val;
      if (e.target.classList.contains('prepay-input')) tableData[idx].prepayPct = val; // 범위 보정은 focusout에서
      
      updateTotals(); // 실시간 수식 합계 변경
      saveToFirebase();
    }
  });

  // 단가 입력 완료 시 (엔터키 또는 포커스 아웃에 의한 확정) DOM 재정렬
  tbody.addEventListener('change', (e) => {
    if (e.target.classList.contains('unit-input')) {
      applySortToDOM(); 
    }
  });

  // 엑셀 스타일: 포커스 시 숫자만 표기, 콤마 제거
  tbody.addEventListener('focusin', (e) => {
    if (e.target.classList.contains('num-input')) {
      if(!e.target.classList.contains('prepay-input')) {
        e.target.value = parseNum(e.target.value) || ''; 
      }
      e.target.select();
    }
  });

  // 엑셀 스타일: 포커스 아웃 시 서식 적용 & 범위 보정
  tbody.addEventListener('focusout', (e) => {
    if (e.target.classList.contains('num-input')) {
      let val = parseNum(e.target.value);
      
      // 선지급률은 0~100 사이로 자동 보정
      if (e.target.classList.contains('prepay-input')) {
        val = Math.max(0, Math.min(100, val));
        e.target.value = val;
        
        const idx = e.target.getAttribute('data-index');
        tableData[idx].prepayPct = val;
        updateTotals();
        saveToFirebase();
      } else {
        // 단가/품목수는 천 단위 콤마 추가
        e.target.value = fmtNum(val);
      }
    }
  });

  // 삭제 버튼 클릭
  tbody.addEventListener('click', (e) => {
    const btn = e.target.closest('.delete-btn');
    if (btn) {
      const idx = btn.getAttribute('data-index');
      tableData.splice(idx, 1);
      renderTable(); 
      updateTotals();
      saveToFirebase();
    }
  });

  // 일괄 선지급률 적용 버튼
  document.getElementById('btnBatchPrepay').addEventListener('click', () => {
    let val = parseNum(document.getElementById('batchPrepayInput').value);
    val = Math.max(0, Math.min(100, val)); // 0~100 사이 보정
    document.getElementById('batchPrepayInput').value = val;
    
    // 데이터 변경
    tableData.forEach(d => d.prepayPct = val);
    
    // 화면 내의 모든 인풋 값 업데이트
    tbody.querySelectorAll('.prepay-input').forEach(input => {
      input.value = val;
    });
    
    updateTotals();
    saveToFirebase();
  });

  // 수량 직접 입력 변경
  const qtyInput = document.getElementById('qtyInput');
  qtyInput.addEventListener('input', (e) => {
    const v = parseInt(e.target.value);
    if (v > 0) {
      currentQty = v;
      updateTotals();
      updatePresetButtons();
      saveToFirebase();
    }
  });

  // 수량 프리셋 버튼 클릭
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const val = parseInt(e.target.getAttribute('data-val'));
      currentQty = val;
      qtyInput.value = val;
      updateTotals();
      updatePresetButtons();
      saveToFirebase();
    });
  });

  // 전체 선택/해제
  document.getElementById('checkAll').addEventListener('change', (e) => {
    const isChecked = e.target.checked;
    tableData.forEach(d => d.active = isChecked);
    renderTable(); 
    updateTotals();
    saveToFirebase();
  });

  // 항목 추가 버튼
  document.getElementById('addBtn').addEventListener('click', () => {
    tableData.push({
      id: Date.now(),
      name: '',
      items: 1,
      unit: 0,
      prepayPct: 0,
      active: true
    });
    
    // 추가 후 정렬 무너지지 않게 한번 정렬(새 항목은 0원이므로 제일 아래로 감) 후 렌더
    tableData.sort((a, b) => b.unit - a.unit);
    renderTable();
    updateTotals();
    saveToFirebase();
    
    // 새로 추가된 행(맨 아래)의 첫 번째 입력창으로 포커스
    const newInputs = tbody.lastElementChild.querySelectorAll('input[type="text"]');
    if(newInputs.length > 0) newInputs[0].focus();
    
    // 스크롤 맨 아래로 이동
    tbody.parentElement.parentElement.scrollTop = tbody.parentElement.parentElement.scrollHeight;
  });
}

// 상단 프리셋 버튼 활성화 UI
function updatePresetButtons() {
  document.querySelectorAll('.preset-btn').forEach(btn => {
    const val = parseInt(btn.getAttribute('data-val'));
    if (val === currentQty) {
      btn.classList.add('bg-blue-100', 'border-blue-300', 'text-blue-700', 'font-bold');
      btn.classList.remove('bg-white', 'text-gray-700');
    } else {
      btn.classList.remove('bg-blue-100', 'border-blue-300', 'text-blue-700', 'font-bold');
      btn.classList.add('bg-white', 'text-gray-700');
    }
  });
}

// 시스템 부팅
init();
</script>
