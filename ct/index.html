// ─── 태그 색상 팔레트 (노션 스타일) ───
const TAG_COLORS = [
  { bg: '#e8f0fe', text: '#1a56db', border: '#c3d9f7', name: '파랑' },
  { bg: '#fef3c7', text: '#b45309', border: '#fde68a', name: '노랑' },
  { bg: '#d1fae5', text: '#065f46', border: '#a7f3d0', name: '초록' },
  { bg: '#fce7f3', text: '#9d174d', border: '#fbcfe8', name: '분홍' },
  { bg: '#ede9fe', text: '#5b21b6', border: '#ddd6fe', name: '보라' },
  { bg: '#fee2e2', text: '#991b1b', border: '#fecaca', name: '빨강' },
  { bg: '#f3f4f6', text: '#374151', border: '#d1d5db', name: '회색' },
  { bg: '#ecfdf5', text: '#047857', border: '#a7f3d0', name: '민트' },
  { bg: '#fff7ed', text: '#c2410c', border: '#fed7aa', name: '주황' },
  { bg: '#f0f9ff', text: '#0369a1', border: '#bae6fd', name: '하늘' },
];
const getTagColor = (tag, allTags) => {
  const idx = allTags.indexOf(tag);
  return TAG_COLORS[idx >= 0 ? idx % TAG_COLORS.length : Math.abs(tag.split('').reduce((a,c) => a + c.charCodeAt(0), 0)) % TAG_COLORS.length];
};

// ─── 다중선택 태그 컴포넌트 (노션 스타일) ───
function MultiSelectTags({ selected, allTags, onChange }) {
  const [isOpen, setIsOpen] = useState(false);
  const [newTag, setNewTag] = useState('');
  const ref = useRef(null);

  useEffect(() => {
    const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setIsOpen(false); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, []);

  const toggle = (tag) => {
    if (selected.includes(tag)) onChange(selected.filter(t => t !== tag));
    else onChange([...selected, tag]);
  };

  const addNew = () => {
    const t = newTag.trim();
    if (!t) return;
    if (!selected.includes(t)) onChange([...selected, t]);
    setNewTag('');
  };

  return (
    <div ref={ref} className="relative">
      <div
        onClick={() => setIsOpen(!isOpen)}
        className="flex flex-wrap gap-1 items-center min-h-[28px] px-2 py-1 border border-[#e6e8ea] rounded-lg cursor-pointer hover:border-[#111c2d] transition-colors bg-white min-w-[100px]"
      >
        {selected.length === 0 && <span className="text-[10px] text-[#b0b8c4]">분류 선택...</span>}
        {selected.map(tag => {
          const c = getTagColor(tag, allTags);
          return (
            <span key={tag} className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-bold whitespace-nowrap" style={{ background: c.bg, color: c.text, border: `1px solid ${c.border}` }}>
              {tag}
              <button onClick={(e) => { e.stopPropagation(); toggle(tag); }} className="hover:opacity-60"><X size={10} /></button>
            </span>
          );
        })}
      </div>
      {isOpen && (
        <div className="absolute right-0 top-full mt-1 bg-white rounded-xl shadow-2xl border border-[#e6e8ea] w-56 z-50 p-2 max-h-64 overflow-y-auto">
          <div className="flex gap-1 mb-2">
            <input
              value={newTag}
              onChange={(e) => setNewTag(e.target.value)}
              onKeyDown={(e) => { if(e.key === 'Enter') { e.preventDefault(); addNew(); } }}
              placeholder="새 분류 입력..."
              className="flex-1 text-xs px-2 py-1.5 border border-[#e6e8ea] rounded-lg outline-none focus:border-[#111c2d]"
              onClick={(e) => e.stopPropagation()}
            />
            <button onClick={(e) => { e.stopPropagation(); addNew(); }} className="px-2 py-1 bg-[#111c2d] text-white text-[10px] font-bold rounded-lg hover:bg-[#2a3a52]">추가</button>
          </div>
          {allTags.filter(t => t !== '미지정').map(tag => {
            const c = getTagColor(tag, allTags);
            const active = selected.includes(tag);
            return (
              <button
                key={tag}
                onClick={(e) => { e.stopPropagation(); toggle(tag); }}
                className="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-[#f7f9fb] transition-colors text-left"
              >
                <div className={`w-4 h-4 rounded border flex items-center justify-center ${active ? 'bg-[#111c2d] border-[#111c2d]' : 'border-[#d1d5db]'}`}>
                  {active && <Check size={10} className="text-white" />}
                </div>
                <span className="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold" style={{ background: c.bg, color: c.text, border: `1px solid ${c.border}` }}>{tag}</span>
              </button>
            );
          })}
          {allTags.filter(t => t !== '미지정').length === 0 && (
            <p className="text-center text-[10px] text-[#b0b8c4] py-2">분류를 입력해서 추가하세요</p>
          )}
        </div>
      )}
    </div>
  );
}

// ─────────────────────────── RAW_DATA 파서 (초기값 생성용) ───────────────────────────
function parseRawData() {
  const lines = RAW_DATA.split('\n').map(l => l.trim()).filter(l => l && !l.includes('부품명 수량 단가'));
  return lines.map((line, index) => {
    const regex = /^(.*?)\s+(\d+)\s+([\d,\-]+)\s+(?:([\d,\-]+)\s+)?([\d,\-]+)\s+(\S+)$/;
    const match = line.match(regex);
    let name, qty, price, postProcess, supplier;
    if (match) {
      name = match[1].trim();
      qty = parseInt(match[2].replace(/,/g, ''), 10) || 0;
      price = match[3] === '-' ? 0 : parseInt(match[3].replace(/,/g, ''), 10) || 0;
      postProcess = match[4] ? (match[4] === '-' ? 0 : parseInt(match[4].replace(/,/g, ''), 10)) : 0;
      supplier = match[6].trim();
    } else {
      const tokens = line.split(/\s+/);
      if (tokens.length >= 3) {
        supplier = tokens.pop();
        const totalStr = tokens.pop();
        const totalFallback = totalStr === '-' ? 0 : parseInt(totalStr.replace(/,/g, ''), 10) || 0;
        qty = 1; price = totalFallback; postProcess = 0;
        name = tokens.join(' ');
      } else { return null; }
    }
    return { id: index, name, qty, price, postProcess, supplier };
  }).filter(Boolean);
}

          <section className="grid grid-cols-1 md:grid-cols-12 gap-6">
            {/* Unit Cost - Light Box */}
            <div className="md:col-span-4 bg-white p-8 rounded-2xl flex flex-col justify-between border border-[#e6e8ea] shadow-sm">
              <span className="uppercase text-[10px] font-bold tracking-[0.2em] text-[#54647a]">총 부품 원가 (단일 기준)</span>
              <div className="mt-6">
                <span className="text-4xl lg:text-5xl font-extrabold tracking-tighter text-[#111c2d]">
                  {formatCurrency(totals.amount)}
                </span>
                <div className="flex items-center gap-1 mt-3 text-[#54647a]">
                  <span className="text-xs font-medium bg-[#f2f4f6] px-2 py-1 rounded">단일 기기 제작 기준</span>
                </div>
              </div>
            </div>

            {/* Total Production Cost - Dark Impact Box */}
            <div className="md:col-span-5 bg-[#111c2d] p-8 rounded-2xl flex flex-col justify-between shadow-xl relative overflow-hidden">
              <div className="absolute top-0 right-0 p-8 opacity-10">
                <Calculator size={120} className="text-white" />
              </div>
              <span className="uppercase text-[10px] font-bold tracking-[0.2em] text-[#79849a] relative z-10">총 목표 생산 원가</span>
              <div className="mt-6 relative z-10">
                <span className="text-4xl lg:text-5xl font-extrabold tracking-tighter text-white">
                  {formatCurrency(totals.amount * productionQty)}
                </span>
                <p className="text-xs text-[#79849a] mt-3 font-medium uppercase tracking-wider">{productionQty}대 생산 기준 예상 산출액</p>
              </div>
            </div>

            {/* Inventory Logistics - Clean Box */}
            <div className="md:col-span-3 bg-white p-8 rounded-2xl flex flex-col justify-between border border-[#e6e8ea] shadow-sm">
              <span className="uppercase text-[10px] font-bold tracking-[0.2em] text-[#54647a]">재고 및 부품 품목 현황</span>
              <div className="mt-6">
                <span className="text-4xl font-extrabold text-[#111c2d] tracking-tight">
                  {new Intl.NumberFormat('ko-KR').format(totals.totalQty * productionQty)} <span className="text-xl font-bold text-[#79849a]">개</span>
                </span>
                <p className="text-xs text-[#54647a] mt-3 tracking-tight font-medium">검증된 <span className="font-bold text-[#111c2d]">{totals.vendorCount}</span>개의 공급업체 유지</p>
              </div>
            </div>
          </section>

          {/* Conditional Rendering based on Tabs */}
          {activeTab === 'summary' && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 animate-in fade-in duration-500">
              
              {/* Left Column: Top Drivers & Health */}
              <div className="lg:col-span-1 flex flex-col gap-6">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-[#e6e8ea]">
                  <div className="flex justify-between items-center mb-8">
                    <h3 className="font-bold text-lg text-[#111c2d] tracking-tight">지출 상위 5개 공급업체</h3>
                  </div>
                  <div className="space-y-6">
                    {vendors.slice(0, 5).map((v, idx) => (
                      <div key={v.name} className="space-y-2">
                        <div className="flex justify-between text-[11px] font-bold uppercase text-[#54647a]">
                          <span className="truncate max-w-[140px]" title={v.name}>{v.name}</span>
                          <span className="text-[#111c2d]">{formatCurrency(v.totalAmount * productionQty)}</span>
                        </div>
                        <div className="h-2 w-full bg-[#f2f4f6] rounded-full overflow-hidden">
                          <div 
                            className="h-full bg-[#111c2d] rounded-full transition-all duration-1000 ease-out" 
                            style={{ width: `${maxAmount > 0 ? ((v.totalAmount * productionQty) / maxAmount) * 100 : 0}%` }}
                          ></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Vendor Types Summary */}
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-[#e6e8ea]">
                  <h3 className="font-bold text-lg text-[#111c2d] tracking-tight mb-6">분류별 지출 요약</h3>
                  {typeSummary.length === 1 && typeSummary[0].type === '미지정' ? (
                    <div className="text-center p-6 text-sm text-[#79849a] bg-[#f7f9fb] rounded-xl border border-dashed border-[#c6c6cd]">
                      우측 표에서 종류를 입력하면<br/>여기에 카테고리별 요약이 표시됩니다.
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {typeSummary.map(t => (
                        <div key={t.type} className="flex items-center justify-between p-4 bg-[#f7f9fb] rounded-xl border border-[#e6e8ea]">
                          <div>
                            <div className="font-bold text-[#111c2d] flex items-center gap-2">
                              {t.type === '미지정' ? <span className="text-[#79849a]">분류 안 됨</span> : t.type}
                            </div>
                            <p className="text-xs text-[#54647a] mt-1">{t.vendorCount}개 업체</p>
                          </div>
                          <div className="font-extrabold text-[#111c2d]">
                            {formatCurrency(t.totalAmount * productionQty)}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              {/* Right Column: Ledger Table */}
              <div className="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-[#e6e8ea] flex flex-col">
                <div className="p-8 pb-4 flex justify-between items-end border-b border-[#e6e8ea]">
                  <div>
                    <h3 className="font-extrabold text-2xl text-[#111c2d] tracking-tight">공급업체별 장부 (외주 현황)</h3>
                    <p className="text-sm text-[#54647a] mt-1">공급업체에 따른 디테일한 가격 구성 내역입니다.</p>
                  </div>
                </div>
                
                <div className="overflow-x-auto flex-grow">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-[#f7f9fb]">
                        <th className="px-6 py-4 text-[10px] font-bold uppercase tracking-widest text-[#79849a] border-b border-[#e6e8ea]">업체명</th>
                        <th className="px-6 py-4 text-[10px] font-bold uppercase tracking-widest text-[#79849a] border-b border-[#e6e8ea] text-center">품목 수</th>
                        <th className="px-6 py-4 text-[10px] font-bold uppercase tracking-widest text-[#79849a] border-b border-[#e6e8ea] text-right">단일가 합계</th>
                        <th className="px-6 py-4 text-[10px] font-bold uppercase tracking-widest text-[#111c2d] border-b border-[#e6e8ea] text-right bg-[#f2f4f6]">총 금액 ({productionQty})</th>
                        <th className="px-6 py-4 text-[10px] font-bold uppercase tracking-widest text-[#79849a] border-b border-[#e6e8ea] text-center">설정 분류</th>
                      </tr>
                    </thead>
                    <tbody className="text-sm">
                      {vendors.map((v, idx) => (
                        <tr key={v.name} className="hover:bg-[#f7f9fb] transition-colors border-b border-[#f2f4f6] last:border-0">
                          <td className="px-6 py-4 font-semibold text-[#111c2d] truncate max-w-[200px]" title={v.name}>
                            {v.name}
                          </td>
                          <td className="px-6 py-4 text-center">
                            <button
                              onClick={() => setVendorPopup(v.name)}
                              className="inline-flex items-center gap-1 px-3 py-1 bg-[#f2f4f6] hover:bg-[#e6e8ea] text-[#111c2d] rounded-lg font-bold text-xs transition-colors cursor-pointer border border-[#e6e8ea] hover:border-[#111c2d]"
                              title="클릭하여 부품 목록 보기"
                            >
                              {v.itemCount}
                              <ArrowRight size={12} className="text-[#79849a]" />
                            </button>
                          </td>
                          <td className="px-6 py-4 text-right text-[#54647a]">
                            {formatCurrency(v.totalAmount)}
                          </td>
                          <td className="px-6 py-4 text-right font-bold text-[#111c2d] bg-[#f2f4f6]/50">
                            {formatCurrency(v.totalAmount * productionQty)}
                          </td>
                          <td className="px-4 py-3">
                            <MultiSelectTags
                              selected={getVendorTags(v.name)}
                              allTags={allTagsList}
                              onChange={(tags) => handleTypeChange(v.name, tags)}
                            />
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* Details Tab */}
          {activeTab === 'details' && (
            <div className="bg-white rounded-2xl shadow-sm border border-[#e6e8ea] overflow-hidden animate-in fade-in duration-500 flex flex-col">
              <div className="p-8 pb-6 border-b border-[#e6e8ea] flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
                <div>
                  <h3 className="font-extrabold text-2xl text-[#111c2d] tracking-tight">부품 카탈로그 및 실시간 편집장</h3>
                  <p className="text-sm text-[#54647a] mt-2">아래 표의 아무 셀이나 클릭하면 실시간으로 데이터를 수정할 수 있습니다.</p>
                </div>
                {/* 공급업체 필터 (엑셀 스타일) */}
                <div ref={filterRef} className="relative">
                  <button
                    onClick={() => setIsFilterOpen(!isFilterOpen)}
                    className={`flex items-center gap-2 px-4 py-2 text-xs font-bold rounded-xl border transition-colors ${
                      supplierFilter.length > 0
                        ? 'bg-[#111c2d] text-white border-[#111c2d]'
                        : 'bg-white text-[#54647a] border-[#e6e8ea] hover:border-[#111c2d]'
                    }`}
                  >
                    <Filter size={14} />
                    {supplierFilter.length > 0 ? `${supplierFilter.length}개 업체 필터` : '공급업체 필터'}
                    <ChevronDown size={14} />
                  </button>
                  {isFilterOpen && (
                    <div className="absolute right-0 top-full mt-2 bg-white rounded-xl shadow-2xl border border-[#e6e8ea] w-64 z-50 max-h-80 overflow-hidden flex flex-col">
                      <div className="p-3 border-b border-[#e6e8ea] flex items-center justify-between">
                        <span className="text-[10px] font-bold uppercase text-[#79849a]">공급업체 선택</span>
                        <button
                          onClick={() => { setSupplierFilter([]); setIsFilterOpen(false); }}
                          className="text-[10px] font-bold text-[#111c2d] hover:underline"
                        >{supplierFilter.length > 0 ? '전체 해제' : '전체 선택'}</button>
                      </div>
                      <div className="overflow-y-auto flex-1 p-1">
                        {allSuppliers.map(s => {
                          const active = supplierFilter.includes(s);
                          const count = items.filter(i => i.supplier === s).length;
                          return (
                            <button
                              key={s}
                              onClick={() => {
                                if (active) setSupplierFilter(supplierFilter.filter(x => x !== s));
                                else setSupplierFilter([...supplierFilter, s]);
                              }}
                              className="w-full flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-[#f7f9fb] transition-colors text-left"
                            >
                              <div className={`w-4 h-4 rounded border flex items-center justify-center flex-shrink-0 ${active ? 'bg-[#111c2d] border-[#111c2d]' : 'border-[#d1d5db]'}`}>
                                {active && <Check size={10} className="text-white" />}
                              </div>
                              <span className="text-xs font-medium text-[#111c2d] truncate flex-1">{s}</span>
                              <span className="text-[10px] text-[#79849a] font-mono">{count}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {supplierFilter.length > 0 && (
                <div className="px-8 py-2 bg-[#f7f9fb] border-b border-[#e6e8ea] flex items-center gap-2 flex-wrap">
                  <span className="text-[10px] font-bold text-[#79849a] uppercase">필터:</span>
                  {supplierFilter.map(s => (
                    <span key={s} className="inline-flex items-center gap-1 px-2 py-0.5 bg-[#111c2d] text-white rounded-md text-[10px] font-bold">
                      {s}
                      <button onClick={() => setSupplierFilter(supplierFilter.filter(x => x !== s))} className="hover:opacity-60"><X size={10} /></button>
                    </span>
                  ))}
                  <button onClick={() => setSupplierFilter([])} className="text-[10px] font-bold text-[#79849a] hover:text-[#111c2d] ml-2">전체 보기</button>
                </div>
              )}
              
              <div className="overflow-x-auto max-h-[calc(100vh-350px)]">
                <table className="w-full text-left border-collapse relative">
                  <thead className="sticky top-0 bg-[#f7f9fb] z-10 shadow-sm outline outline-1 outline-[#e6e8ea]">
                    <tr>
                      <th className="px-4 py-4 text-[10px] font-bold uppercase tracking-widest text-[#79849a] text-center w-12">번호</th>
                      <th className="px-4 py-4 text-[10px] font-bold uppercase tracking-widest text-[#79849a] min-w-[250px]">부품/품종명</th>
                      <th className="px-4 py-4 text-[10px] font-bold uppercase tracking-widest text-[#79849a] text-center w-24">수량</th>
                      <th className="px-4 py-4 text-[10px] font-bold uppercase tracking-widest text-[#79849a] text-right w-32">단가</th>
                      <th className="px-4 py-4 text-[10px] font-bold uppercase tracking-widest text-[#79849a] text-right w-32">후공정 처리비</th>
                      <th className="px-4 py-4 text-[10px] font-bold uppercase tracking-widest text-[#111c2d] text-right w-36 bg-[#f2f4f6]">단가 총계</th>
                      <th className="px-4 py-4 text-[10px] font-bold uppercase tracking-widest text-[#79849a] w-48">담당 공급업체</th>
                    </tr>
                  </thead>
                  <tbody className="text-sm">
                    {filteredItems.map((item, idx) => (
                      <tr key={item.id} className="hover:bg-[#f7f9fb] border-b border-[#f2f4f6] focus-within:bg-[#f2f4f6]/50 transition-colors">
                        <td className="px-4 py-3 text-center text-[#79849a] font-mono text-xs">{String(idx + 1).padStart(2, '0')}</td>
                        <td className="px-4 py-3">
                          <input
                            type="text"
                            value={item.name}
                            onChange={(e) => handleItemUpdate(item.id, 'name', e.target.value)}
                            className="w-full bg-transparent border-b border-transparent focus:border-[#111c2d] px-2 py-1 outline-none transition-colors font-medium text-[#111c2d]"
                          />
                        </td>
                        <td className="px-4 py-3">
                          <input
                            type="number"
                            min="0"
                            value={item.qty === 0 ? '' : item.qty}
                            onChange={(e) => handleItemUpdate(item.id, 'qty', e.target.value === '' ? 0 : Number(e.target.value))}
                            className="w-full text-center border border-[#e6e8ea] rounded p-1 focus:border-[#111c2d] outline-none bg-white font-mono text-xs"
                          />
                        </td>
                        <td className="px-4 py-3">
                          <input
                            type="number"
                            min="0"
                            value={item.price === 0 ? '' : item.price}
                            onChange={(e) => handleItemUpdate(item.id, 'price', e.target.value === '' ? 0 : Number(e.target.value))}
                            className="w-full text-right border border-[#e6e8ea] rounded p-1 focus:border-[#111c2d] outline-none bg-white font-mono text-xs"
                          />
                        </td>
                        <td className="px-4 py-3">
                          <input
                            type="number"
                            min="0"
                            value={item.postProcess === 0 ? '' : item.postProcess}
                            onChange={(e) => handleItemUpdate(item.id, 'postProcess', e.target.value === '' ? 0 : Number(e.target.value))}
                            className="w-full text-right border border-[#e6e8ea] rounded p-1 focus:border-[#111c2d] outline-none bg-white font-mono text-xs"
                          />
                        </td>
                        <td className="px-4 py-3 text-right font-bold text-[#111c2d] bg-[#f2f4f6]/30">
                          {new Intl.NumberFormat('ko-KR').format((item.price * item.qty) + item.postProcess)}
                        </td>
                        <td className="px-4 py-3">
                          <input
                            type="text"
                            value={item.supplier}
                            onChange={(e) => handleItemUpdate(item.id, 'supplier', e.target.value)}
                            className="w-full bg-transparent border-b border-transparent focus:border-[#111c2d] px-2 py-1 outline-none transition-colors text-[#54647a]"
                          />
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {supplierFilter.length > 0 && (
                <div className="px-8 py-3 bg-[#f7f9fb] border-t border-[#e6e8ea] flex items-center justify-between">
                  <span className="text-xs text-[#54647a]">필터된 부품: <strong className="text-[#111c2d]">{filteredItems.length}</strong>개 / 전체 {items.length}개</span>
                  <span className="text-xs font-bold text-[#111c2d]">필터 합계: {formatCurrency(filteredItems.reduce((s, i) => s + (i.price * i.qty) + i.postProcess, 0))}</span>
                </div>
              )}
            </div>
          )}

        </div>
      </main>
      
      {/* Mobile Nav */}
      <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md p-4 flex justify-around items-center z-50 border-t border-[#e6e8ea]">
        <button 
          onClick={() => setActiveTab('summary')}
          className={`flex flex-col items-center gap-1 ${activeTab === 'summary' ? 'text-[#111c2d]' : 'text-[#79849a]'}`}
        >
          <LayoutDashboard size={20} />
          <span className="text-[10px] font-bold uppercase tracking-wider">원가 개요</span>
        </button>
        <button 
          onClick={() => setActiveTab('details')}
          className={`flex flex-col items-center gap-1 ${activeTab === 'details' ? 'text-[#111c2d]' : 'text-[#79849a]'}`}
        >
          <Edit size={20} />
          <span className="text-[10px] font-bold uppercase tracking-wider">카탈로그</span>
        </button>
      </nav>
    </div>
    }
    </>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
